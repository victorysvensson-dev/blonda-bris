<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f6f1f4">
<title>BLONDA BRIS</title>
<link rel="preload" href="fonts/blonda-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="logo">BLONDA</div>
    <nav id="tabs"></nav>
    <div class="hright">
      <div id="tempo" title="Drag up/down to change tempo"><span class="dot"></span><span id="bpm">120.0 BPM</span></div>
      <button id="menuBtn" aria-label="Sounds"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>
  <nav id="tabs2"></nav>
  <section id="left" class="panel"></section>
  <section id="stage"><canvas id="fBack" class="fl"></canvas><canvas id="fGl" class="fl"></canvas><canvas id="fFront" class="fl"></canvas></section>
  <section id="right" class="panel"></section>
  <section id="trans">
    <div class="side">
      <button class="vbtn on" id="vRoll" aria-label="Rulle"><svg class="ic" viewBox="0 0 24 24"><path d="M4 8h6M8 12h7M13 16h7"/></svg></button>
      <button class="vbtn" id="vKeys" aria-label="Tangenter"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/><path d="M8.5 5.5v8M12 5.5v13M15.5 5.5v8"/></svg></button>
    </div>
    <div class="mid">
      <button id="back" aria-label="Till början"><svg class="ic" viewBox="0 0 24 24"><path d="M7 6v12M18 6l-8 6 8 6z"/></svg></button>
      <button id="play" aria-label="Spela"><svg class="p" viewBox="0 0 24 24"><path d="M7 4.5l13 7.5-13 7.5z"/></svg><svg class="s" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <button id="stop" aria-label="Stopp"><svg class="ic" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx=".5"/></svg></button>
    </div>
    <div class="side r" id="tside"></div>
  </section>
  <section id="bottom"><div id="roll"><canvas></canvas></div><div id="keys"><canvas></canvas></div></section>
</div>
<div id="menu">
  <div class="shade"></div>
  <div class="sheet">
    <div class="top"><div class="t">SOUNDS</div><button id="menuClose" aria-label="Stäng"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="list" id="list"></div>
    <div class="foot" id="mfoot"></div>
  </div>
</div>
<div id="start"><div>TAP TO PLAY</div></div>
<script src="data.js"></script>
<script src="bridge.js"></script>
<script src="blommor.js"></script>
<script src="app.js"></script>
</body>
</html>
